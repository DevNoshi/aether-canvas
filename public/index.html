<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherCanvas | Collaborative Whiteboard & Merkle Stream</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Socket.io Client -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            background-color: #05070b;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        .neon-border {
            border: 1px solid #1f6beb;
            box-shadow: 0 0 15px rgba(31, 107, 235, 0.15);
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.6);
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #0d1117;
        }

        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 3px;
        }

        canvas {
            cursor: crosshair;
        }
    </style>
</head>

<body class="h-screen w-screen flex flex-col justify-between p-3">

    <!-- CABEÇALHO -->
    <header class="flex justify-between items-center pb-3 border-b border-gray-800 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-blue-500 rounded-full animate-ping"></div>
            <h1 class="text-xl font-black tracking-widest text-blue-400 neon-text">AETHER<span
                    class="text-white">CANVAS</span> <span class="text-[10px] text-gray-500">v1.1-REPLAY</span></h1>
        </div>

        <!-- FERRAMENTAS & TIME TRAVEL -->
        <div class="flex items-center space-x-3 text-xs">
            <div class="flex items-center space-x-2 bg-[#0d1117] px-3 py-1.5 rounded border border-gray-800">
                <span class="text-gray-400">Cor:</span>
                <input type="color" id="colorPicker" value="#58a6ff"
                    class="w-6 h-6 bg-transparent border-0 cursor-pointer">
            </div>
            <div class="flex items-center space-x-2 bg-[#0d1117] px-3 py-1.5 rounded border border-gray-800">
                <span class="text-gray-400">Pincel:</span>
                <input type="range" id="brushSize" min="1" max="20" value="3" class="w-20 accent-blue-500">
            </div>
            <button id="btnClear"
                class="bg-red-900/40 hover:bg-red-900 text-red-300 px-3 py-1.5 rounded border border-red-800 transition font-bold">
                Limpar Tela
            </button>

            <!-- ADICIONE ESTES BOTÕES NA SUA BARRA DE FERRAMENTAS -->
            <div class="flex items-center space-x-2 bg-[#0d1117] px-3 py-1.5 rounded border border-gray-800 text-xs">
                <span class="text-purple-400 font-bold">🛡️ Auditoria:</span>
                <button id="btnAudit"
                    class="bg-purple-600/30 hover:bg-purple-600 text-purple-300 px-2 py-1 rounded border border-purple-700 transition font-bold">
                    Validar Cadeia
                </button>
                <button id="btnTamper"
                    class="bg-red-900/30 hover:bg-red-900 text-red-300 px-2 py-1 rounded border border-red-800 transition font-bold"
                    title="Simula ataque de corrupção de dados">
                    Simular Fraude
                </button>
            </div>

            <!-- CONTROLE DE TIME TRAVEL -->
            <div class="flex items-center space-x-2 bg-[#0d1117] px-3 py-1.5 rounded border border-gray-800">
                <span class="text-yellow-400 font-bold">⏱️ Time Travel:</span>
                <button id="btnToggleTimeTravel"
                    class="bg-yellow-600/30 hover:bg-yellow-600 text-yellow-300 px-2 py-1 rounded border border-yellow-700 transition font-bold">
                    Ativar Replay
                </button>
                <input type="range" id="timeSlider" min="0" value="0" class="w-28 accent-yellow-500 hidden" disabled>
                <span id="sliderLabel" class="text-gray-400 font-mono hidden">Bloco: 0/0</span>
            </div>
        </div>

        <div class="bg-gray-900 px-3 py-1.5 rounded border border-gray-800 text-xs">
            ESTADO: <span id="sync-status" class="text-green-400 font-bold">SINCRONIZADO</span>
        </div>
    </header>

    <!-- PAINEL PRINCIPAL -->
    <main class="grid grid-cols-1 lg:grid-cols-4 gap-3 my-3 flex-grow overflow-hidden">
        <div class="bg-[#0d1117] rounded-xl neon-border relative overflow-hidden flex flex-col lg:col-span-3">
            <div
                class="absolute top-3 left-4 text-[10px] text-gray-500 tracking-widest uppercase pointer-events-none z-10">
                Quadro de Desenho Colaborativo</div>
            <canvas id="whiteboard" class="w-full h-full"></canvas>
        </div>

        <div class="bg-[#0d1117] p-3 rounded-xl neon-border flex flex-col h-full overflow-hidden">
            <div class="flex justify-between items-center mb-2 pb-2 border-b border-gray-800 shrink-0">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">🔗 Merkle Chain Stream</h2>
                <span class="text-[10px] text-blue-400 font-mono" id="block-count">Blocos: 0</span>
            </div>
            <div id="merkle-stream" class="flex-grow overflow-y-auto space-y-2 pr-1 text-[11px]">
                <div class="text-gray-600 text-center italic py-4">Aguardando blocos genesis...</div>
            </div>
        </div>
    </main>

    <!-- IMPORTAÇÃO DA ENGINE DE CANVAS -->
    <script src="/canvasEngine.js"></script>

    <!-- SCRIPT DE CONEXÃO SOCKET.IO & TIME TRAVEL -->
    <script>
        const socket = io();
        const canvasElement = document.getElementById('whiteboard');
        const merkleStream = document.getElementById('merkle-stream');
        const blockCount = document.getElementById('block-count');
        const btnClear = document.getElementById('btnClear');

        const btnToggleTimeTravel = document.getElementById('btnToggleTimeTravel');
        const timeSlider = document.getElementById('timeSlider');
        const sliderLabel = document.getElementById('sliderLabel');

        let isTimeTravelMode = false;
        let cachedBlocks = [];

        // Inicializa a engine de desenho
        const whiteboard = new CanvasEngine(canvasElement, (actionData) => {
            if (!isTimeTravelMode) {
                socket.emit('canvas_action', actionData);
            }
        });

        // Limpar tela
        btnClear.addEventListener('click', () => {
            if (!isTimeTravelMode) {
                whiteboard.clear();
                socket.emit('canvas_action', { type: 'CLEAR_CANVAS' });
            }
        });

        // --- LÓGICA DE TIME TRAVEL (REPLAY) ---
        btnToggleTimeTravel.addEventListener('click', () => {
            isTimeTravelMode = !isTimeTravelMode;

            if (isTimeTravelMode) {
                btnToggleTimeTravel.textContent = "Sair do Replay";
                btnToggleTimeTravel.className = "bg-red-600/30 hover:bg-red-600 text-red-300 px-2 py-1 rounded border border-red-700 transition font-bold";
                timeSlider.classList.remove('hidden');
                sliderLabel.classList.remove('hidden');
                timeSlider.removeAttribute('disabled');

                // Pede o estado completo ao servidor
                socket.emit('request_ledger');
            } else {
                exitTimeTravelMode();
            }
        });

        function exitTimeTravelMode() {
            isTimeTravelMode = false;
            btnToggleTimeTravel.textContent = "Ativar Replay";
            btnToggleTimeTravel.className = "bg-yellow-600/30 hover:bg-yellow-600 text-yellow-300 px-2 py-1 rounded border border-yellow-700 transition font-bold";
            timeSlider.classList.add('hidden');
            sliderLabel.classList.add('hidden');
            timeSlider.setAttribute('disabled', 'true');

            // Restaura para o último bloco real
            rebuildCanvasUpTo(cachedBlocks.length);
        }

        socket.on('ledger_state', (blocks) => {
            cachedBlocks = blocks;
            timeSlider.max = blocks.length;
            timeSlider.value = blocks.length;
            sliderLabel.textContent = `Bloco: ${blocks.length}/${blocks.length}`;
            rebuildCanvasUpTo(blocks.length);
        });

        timeSlider.addEventListener('input', (e) => {
            const targetBlockIndex = parseInt(e.target.value);
            sliderLabel.textContent = `Bloco: ${targetBlockIndex}/${cachedBlocks.length}`;
            rebuildCanvasUpTo(targetBlockIndex);
        });

        function rebuildCanvasUpTo(blockLimit) {
            whiteboard.clear();
            for (let i = 0; i < blockLimit && i < cachedBlocks.length; i++) {
                const block = cachedBlocks[i];
                if (block.data && block.data.type === 'DRAW_LINE') {
                    whiteboard.drawLine(block.data);
                } else if (block.data && block.data.type === 'CLEAR_CANVAS') {
                    whiteboard.clear();
                }
            }
        }

        // Sincronização inicial
        socket.on('init_state', (data) => {
            cachedBlocks = data.merkleTree;
            renderMerkleTree(data.merkleTree);
        });

        // Sincronização em tempo real
        socket.on('sync_action', (packet) => {
            cachedBlocks.push(packet.block);

            if (!isTimeTravelMode) {
                if (packet.action.type === 'DRAW_LINE') {
                    whiteboard.drawLine(packet.action);
                } else if (packet.action.type === 'CLEAR_CANVAS') {
                    whiteboard.clear();
                }
            } else {
                timeSlider.max = cachedBlocks.length;
                sliderLabel.textContent = `Bloco: ${timeSlider.value}/${cachedBlocks.length}`;
            }

            appendBlockToStream(packet.block);
        });

        function renderMerkleTree(blocks) {
            blockCount.textContent = `Blocos: ${blocks.length}`;
            merkleStream.innerHTML = blocks.map(b => createBlockHTML(b)).join('');
            merkleStream.scrollTop = merkleStream.scrollHeight;
        }

        function appendBlockToStream(block) {
            if (merkleStream.innerHTML.includes('Aguardando blocos')) {
                merkleStream.innerHTML = '';
            }
            merkleStream.insertAdjacentHTML('beforeend', createBlockHTML(block));
            blockCount.textContent = `Blocos: ${merkleStream.children.length}`;
            merkleStream.scrollTop = merkleStream.scrollHeight;
        }

        // --- LÓGICA DE AUDITORIA E SEGURANÇA ---
        const btnAudit = document.getElementById('btnAudit');
        const btnTamper = document.getElementById('btnTamper');

        btnAudit.addEventListener('click', () => {
            socket.emit('audit_chain');
        });

        btnTamper.addEventListener('click', () => {
            socket.emit('simulate_tamper');
        });

        socket.on('audit_result', (res) => {
            if (res.isValid) {
                alert(`✅ Sucesso na Auditoria!\n\n${res.message}`);
            } else {
                alert(`🚨 FALHA NA AUDITORIA CRIPTOGRÁFICA!\n\n${res.message}`);
            }
        });

        socket.on('chain_compromised', (data) => {
            alert(data.message);
            // Atualiza a interface visual para destacar blocos corrompidos se necessário
            document.body.style.border = "3px solid #ef4444"; // Borda vermelha de alerta na tela
        });

        function createBlockHTML(b) {
            const shortHash = b.hash ? b.hash.substring(0, 12) + '...' : 'N/A';
            const shortPrev = b.previousHash ? b.previousHash.substring(0, 10) + '...' : 'N/A';
            const nonceInfo = b.nonce !== undefined ? `Nonce: ${b.nonce} | ⏱️ ${b.miningTimeMs || 0}ms` : '';

            return `
                <div class="bg-[#161b22] p-2 rounded border border-gray-800 hover:border-yellow-500 transition font-mono">
                    <div class="flex justify-between text-yellow-400 font-bold mb-1">
                        <span>#${b.id} [${b.data.type}]</span>
                        <span class="text-[9px] text-gray-500">${new Date(b.timestamp).toLocaleTimeString()}</span>
                    </div>
                    <div class="text-[10px] text-gray-400 truncate">Hash: <span class="text-green-400">${shortHash}</span></div>
                    <div class="text-[9px] text-gray-600 truncate">Prev: ${shortPrev}</div>
                    <div class="text-[9px] text-yellow-600 mt-1 font-bold">${nonceInfo}</div>
                </div>
            `;
        }
    </script>
</body>

</html>
